name: "Build runner AMI"

# Rebuilds the ubuntu-jammy runner AMI on a schedule.
#
# WHY THIS EXISTS
#
# The GitHub Actions runner binary is baked into the AMI, and the fleet runs
# with auto-update disabled (`disableUpdate=true` on the broker request), so a
# runner can never upgrade itself. GitHub deprecates old runner versions on a
# published date, and from that date the broker answers `403 Forbidden` with
# "Runner version vX is deprecated and cannot receive messages". The instance
# then shuts itself down seconds after boot, so every job sits `queued` forever
# with no runner ever claiming it, and nothing in the AWS-side pipeline looks
# broken: the webhook dispatches, SQS drains, scale-up launches instances.
#
# That is exactly what happened on 2026-08-11 with runner v2.334.0, whose
# deprecation date was 2026-08-10. The warning had been printed as an
# annotation on every CI run for weeks and was missed.
#
# `images/ubuntu-jammy/github_agent.ubuntu.pkr.hcl` defaults `runner_version`
# to the latest release of `actions/runner`, so a plain rebuild is the whole
# fix. Running it monthly keeps the baked version comfortably inside GitHub's
# support window without anyone having to watch for the announcement.
#
# CONSUMING THE RESULT
#
# The AMI name is timestamped, and `shippr/shippr`'s `infra/github-ci` matches
# it with the wildcard `github-runner-ubuntu-jammy-amd64-*` against a
# `most_recent = true` data source. So a new AMI is picked up by the next
# instance the fleet launches, with no Terraform change and no apply.
#
# WHY GITHUB-HOSTED, NOT SELF-HOSTED
#
# Everything else in shippr's CI reaches AWS through the runner instance
# profile (`credential_source = Ec2InstanceMetadata`), which only exists on the
# fleet. Using that here would be circular: the job that repairs the fleet
# could only run while the fleet was healthy, and the one moment it is needed
# is when the fleet is dead — which is precisely the 2026-08-11 situation,
# where the AMI had to be rebuilt from a laptop.
#
# So this runs on `ubuntu-latest` and assumes `GithubActionsRunnerAmiBuildRole`
# in the staging account over OIDC (declared in shippr/shippr
# `infra/github-ci/ami-build-oidc.tf`). No self-hosted runner has to exist for
# this workflow to work.
#
# The role's trust policy is pinned to `refs/heads/main` of this repository, so
# the scheduled and manually-dispatched runs on the default branch can assume
# it and a PR branch cannot.

on:
  schedule:
    # 04:00 UTC on the 2nd of each month. Not the 1st: month boundaries are
    # when everything else scheduled piles up.
    - cron: "0 4 2 * *"
  workflow_dispatch:
    inputs:
      runner_version:
        description:
          "Runner version to bake, without the leading v (default: latest
          release)"
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # assume the AWS role over OIDC

jobs:
  build:
    name: Build ubuntu-jammy AMI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: images/ubuntu-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.15.3"

      - name: Assume the AMI build role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::615233017924:role/GithubActionsRunnerAmiBuildRole
          aws-region: eu-west-1
          role-session-name: packer-runner-ami-build

      # `inputs.runner_version` is attacker-controlled in the sense that
      # matters here: anyone who can dispatch the workflow chooses it. It goes
      # through `env` and is read as a shell variable, never interpolated into
      # the script body, so it cannot break out and run commands (zizmor
      # template-injection).
      - name: Report the version being baked
        env:
          RUNNER_VERSION: ${{ inputs.runner_version }}
        run: |
          if [ -n "$RUNNER_VERSION" ]; then
            echo "Requested runner version: $RUNNER_VERSION"
          else
            latest=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
            echo "Latest actions/runner release: $latest"
          fi

      - name: packer init
        run: packer init .

      - name: packer build
        env:
          RUNNER_VERSION: ${{ inputs.runner_version }}
        run: |
          args=(-var-file=./variables.auto.pkrvars.hcl)
          if [ -n "$RUNNER_VERSION" ]; then
            args+=(-var "runner_version=$RUNNER_VERSION")
          fi
          packer build "${args[@]}" github_agent.ubuntu.pkr.hcl

      - name: Show the resulting AMI
        run: |
          aws ec2 describe-images \
            --owners self \
            --filters 'Name=name,Values=github-runner-ubuntu-jammy-amd64-*' \
            --query 'sort_by(Images,&CreationDate)[-3:].[Name,ImageId,CreationDate]' \
            --output table
